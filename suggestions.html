<style>
:root{--gold:#d5ad55;--gold-light:#f1dba5;--bg:#101010;--card:#1b1b1b;--muted:#c8c0b0;--border:#3a3326}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#302719,var(--bg) 45%) fixed;color:#fff;font-family:Poppins,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.55;padding-bottom:90px}
header{text-align:center;padding:34px 16px 10px}
.sub{color:var(--gold);letter-spacing:3px;font-size:12px;text-transform:uppercase}
h1{font:700 clamp(30px,6vw,46px) 'Playfair Display',Georgia,serif;margin:8px 0}
header p{color:var(--muted);margin:4px 0}
a{color:var(--gold-light);text-underline-offset:4px}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}
main{width:min(760px,94%);margin:20px auto}
section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px}
h2{font:700 22px 'Playfair Display',Georgia,serif;color:var(--gold);margin:0 0 8px}
.item{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid #2a2418}
.item:first-of-type{border-top:0}
.name{font-weight:600}
.desc{font-size:13.5px;color:var(--muted);margin-top:2px}
.until{font-size:12px;color:var(--gold);margin-top:4px}
.price{font-weight:600;color:var(--gold-light);white-space:nowrap}
.empty{text-align:center;color:var(--muted)}
.course{display:grid;grid-template-columns:96px 1fr;gap:6px 16px;padding:16px 0;border-top:1px solid #2a2418}
.course:first-of-type{border-top:0}
.label{color:var(--gold);font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:600;padding-top:3px}
.course .item{border-top:0;padding:0 0 10px}
.course .item:last-child{padding-bottom:0}
.formula{margin:6px 0 0;padding-top:16px;border-top:1px solid var(--gold);text-align:center;color:var(--gold-light);font-size:14.5px;line-height:1.6}
@media(max-width:520px){.course{grid-template-columns:1fr}}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(16,16,16,.94);border-top:1px solid var(--gold);display:flex;gap:10px;justify-content:center}
.bar a{flex:1;max-width:340px;text-align:center;padding:14px;border-radius:10px;font-weight:600;text-decoration:none}
.bar .go{background:var(--gold);color:#17130b}
.bar .alt{border:1px solid var(--gold);color:#fff}
body{background:linear-gradient(rgba(14,11,7,.62),rgba(14,11,7,.88)),url('images/dessert-mangue.jpg') center/cover fixed !important}
header{text-shadow:0 2px 12px rgba(0,0,0,.7)}
section{background:rgba(27,27,27,.84)}
section.sugg{background:rgba(40,32,16,.86)}

<body>
<header>
  <div class="sub">Vaudrée 2 · Liège</div>
  <h1>Nos suggestions gourmandes</h1>
  <p><a href="index.html">← Accueil</a></p>
</header>
<main id="main"><noscript><p class="empty">JavaScript est nécessaire. Appelez-nous au 04 223 18 80.</p></noscript></main>
<div class="bar">
  <a class="go" href="commande-table-vaudree2.html">Réserver &amp; précommander</a>
  <a class="alt" href="menu.html">Découvrir notre carte</a>
</div>
<script>
/* ======== horaires.js ======== */
/* ===== Vaudrée 2 : horaires + outils partagés (source unique) =====
   0 = dimanche … 6 = samedi. [] = fermé. Fermeture après minuit gérée ("01:00").
   Modifiez UNIQUEMENT ici : accueil, carte, suggestions et précommande suivent. */
(function (w) {
  const CFG = {
    HORAIRES: {
      0: [],                              // Dimanche : fermé
      1: [],
      2: [["11:30", "14:30"], ["18:00", "23:00"]],
      3: [["11:30", "14:30"], ["18:00", "23:00"]],
      4: [["11:30", "14:30"], ["18:00", "23:00"]],
      5: [["11:30", "14:30"], ["18:00", "01:00"]],
      6: [["11:30", "15:00"], ["18:00", "01:00"]]
    },
    /* "MM-JJ" = chaque année · "AAAA-MM-JJ" = date précise · [] = fermé */
    EXCEPTIONS: { "12-25": [], "01-01": [], "12-31": [["18:00", "02:00"]] },
    TZ: "Europe/Brussels",
    PHONE: "04 223 18 80",
    TEL: "+3242231880",
    MIDI_UNTIL: 16 * 60, // avant 16h00 = service du midi
    JOURS: ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"]
  };

  const pad = n => String(n).padStart(2, "0");
  const toMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
  const hh = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + "h" + pad(m % 60); };
  const euro = v => Number(v).toLocaleString("fr-BE", { style: "currency", currency: "EUR" });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const shiftDate = (ds, n) => { const [y, m, d] = ds.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
  const dowOf = ds => new Date(ds + "T12:00:00Z").getUTCDay();
  const longDate = ds => new Date(ds + "T12:00:00Z").toLocaleDateString("fr-BE", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });

  function bxl() { // date + minute actuelles à Liège, quel que soit le fuseau du visiteur
    const p = new Intl.DateTimeFormat("en-CA", { timeZone: CFG.TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date());
    const g = t => p.find(x => x.type === t).value;
    const date = g("year") + "-" + g("month") + "-" + g("day");
    return { date, dow: dowOf(date), min: (Number(g("hour")) % 24) * 60 + Number(g("minute")) };
  }
  function servicesFor(ds) {
    if (ds in CFG.EXCEPTIONS) return CFG.EXCEPTIONS[ds];
    const y = ds.slice(5);
    if (y in CFG.EXCEPTIONS) return CFG.EXCEPTIONS[y];
    return CFG.HORAIRES[dowOf(ds)] || [];
  }
  function creneaux(today) { // créneaux absolus en minutes depuis today 00:00 (hier → +8 jours)
    const out = [];
    for (let off = -1; off <= 8; off++) {
      servicesFor(shiftDate(today, off)).forEach(([a, b]) => {
        const s = toMin(a); let e = toMin(b); if (e <= s) e += 1440;
        out.push({ start: off * 1440 + s, end: off * 1440 + e });
      });
    }
    return out.sort((x, y) => x.start - y.start);
  }
  /* Suggestions valides pour une date (et un service "midi"/"soir" facultatif) */
  function suggestionsFor(ds, svc) {
    return (w.SUGGESTIONS || []).map((s, i) => Object.assign({ id: "s-" + i }, s)).filter(s =>
      (!s.du || ds >= s.du) && (!s.au || ds <= s.au) &&
      (!svc || !s.service || s.service === "tous" || s.service === svc));
  }

  /* Regroupe les suggestions en Entrée / Plat / Dessert (type: "entree" | "plat" | "dessert") */
  const TYPES = [["entree", "Entrées", "Entrée"], ["plat", "Plats", "Plat"], ["dessert", "Desserts", "Dessert"]];
  function groupSuggestions(list) {
    const out = TYPES.map(([k, label, one]) => ({ key: k, label, one, items: list.filter(s => s.type === k) }));
    const autres = list.filter(s => !TYPES.some(([k]) => k === s.type));
    if (autres.length) out.push({ key: "autre", label: "Suggestions", one: "Suggestion", items: autres });
    return out.filter(g => g.items.length);
  }

  w.V = Object.assign(CFG, { pad, toMin, hh, euro, esc, shiftDate, dowOf, longDate, bxl, servicesFor, creneaux, suggestionsFor, groupSuggestions });
})(window);

</script>
<script>
/* ======== suggestions-data.js ======== */
/* ===== Nos suggestions gourmandes (source unique) =====
   Chaque suggestion a un TYPE : "entree", "plat" ou "dessert", et son PRIX.
   Le client peut choisir uniquement l'entrée et le dessert, par exemple.
   Elle apparaît automatiquement entre "du" et "au" (inclus) sur la page Suggestions,
   dans la carte et dans la précommande. service : "midi", "soir" ou "tous". Dates : AAAA-MM-JJ.

   Modèle à copier-coller :
   { type: "plat", nom: "Nom du plat", prix: 22, desc: "Description courte", du: "2026-11-02", au: "2026-11-08", service: "tous" },
*/
window.SUGGESTIONS = [
  // EXEMPLES À MODIFIER (valables jusqu'au 31/10, puis ils disparaissent tout seuls)
  { type: "entree",  nom: "Velouté de potimarron",           prix: 9.5, desc: "Crème, éclats de noisettes",        du: "2026-10-23", au: "2026-10-31", service: "tous" },
  { type: "plat",    nom: "Joue de porc braisée",            prix: 22,  desc: "Purée maison / Jus réduit",          du: "2026-10-23", au: "2026-10-31", service: "tous" },
  { type: "dessert", nom: "Tiramisu maison",                 prix: 8,   desc: "Mascarpone / Café / Cacao",          du: "2026-10-23", au: "2026-10-31", service: "tous" }
];

</script>
<script>
const { esc, euro, longDate } = V;
const today = V.bxl().date, list = V.suggestionsFor(today);
const row = s => `<div class="item"><div><div class="name">${esc(s.nom)}${svcNote[s.service] || ""}</div>${s.desc ? `<div class="desc">${esc(s.desc)}</div>` : ""}${s.au ? `<div class="until">Jusqu’au ${esc(longDate(s.au))}</div>` : ""}</div><div class="price">${euro(s.prix)}</div></div>`;
const svcNote = { midi: " · midi", soir: " · soir" };
const FORMULA = "Composez votre repas à votre guise : entrée et plat, plat et dessert, ou simplement l'un des trois. Chaque rubrique est proposée séparément, à son propre prix.";
let html = "";
const groups = V.groupSuggestions(list);
if (groups.length) {
  html = `<section>${groups.map(g => `<div class="course"><div class="label">${esc(g.one)}</div><div>${g.items.map(row).join("")}</div></div>`).join("")}<p class="formula">${esc(FORMULA)}</p></section>`;
}
document.getElementById("main").innerHTML = html ||
  `<section class="empty"><h2>Pas de suggestion pour le moment</h2><p>Revenez bientôt, ou découvrez <a href="menu.html">toute la carte</a>.</p></section>`;
</script>
</body>

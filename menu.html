<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notre carte | Vaudrée 2 · Brasserie à Liège</title>
<meta name="description" content="La carte de la brasserie Vaudrée 2 à Liège : entrées, pâtes fraîches, moules, burgers, viandes, boulets, carbonnade et desserts.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101010">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍺%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#d5ad55;--gold-light:#f1dba5;--bg:#101010;--card:#1b1b1b;--muted:#c8c0b0;--border:#3a3326}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:radial-gradient(circle at top,#302719,var(--bg) 45%) fixed;color:#fff;font-family:Poppins,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.55;padding-bottom:90px}
header{text-align:center;padding:34px 16px 18px}
.sub{color:var(--gold);letter-spacing:3px;font-size:12px;text-transform:uppercase}
h1{font:700 clamp(34px,7vw,52px) 'Playfair Display',Georgia,serif;margin:8px 0;color:#fff}
header p{color:var(--muted);margin:4px 0}
a{color:var(--gold-light);text-underline-offset:4px}
a:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.chips{position:sticky;top:0;z-index:10;display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:rgba(16,16,16,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;padding:8px 14px;border:1px solid var(--gold);border-radius:999px;color:#fff;text-decoration:none;font-size:13.5px;font-weight:500;white-space:nowrap}
.chips a:hover{background:var(--gold);color:#111}
main{width:min(860px,94%);margin:22px auto}
section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px}
section.sugg{border-color:var(--gold);background:rgba(213,173,85,.1)}
h2{font:700 24px 'Playfair Display',Georgia,serif;color:var(--gold);margin:0 0 6px}
.intro{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.item{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid #2a2418}
.item:first-of-type{border-top:0}
.sub{color:var(--gold-light);font-size:15px;margin:14px 0 4px}
.name{font-weight:600}
.desc{font-size:13px;color:var(--muted);margin-top:2px}
.price{font-weight:600;color:var(--gold-light);white-space:nowrap}
.note{color:var(--muted);font-size:13px;text-align:center;margin:24px 0}
.dl{display:inline-block;margin-top:6px;padding:10px 18px;border:1px solid var(--gold);border-radius:999px;color:#fff;text-decoration:none;font-size:14px}
.dl:hover{background:var(--gold);color:#111}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(16,16,16,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--gold);display:flex;gap:10px;justify-content:center}
.bar a{flex:1;max-width:340px;text-align:center;padding:14px;border-radius:10px;font-weight:600;text-decoration:none}
.bar .go{background:var(--gold);color:#17130b}
.bar .alt{border:1px solid var(--gold);color:#fff}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{body{background:#fff;color:#000;padding:0}.chips,.bar,.dl{display:none}section{background:#fff;border:1px solid #999;break-inside:avoid}h2,.price,.name,.desc,.intro{color:#000}}
</style>
</head>
<body>
<header>
  <div class="sub">Brasserie · Restaurant · Beer Shop’E</div>
  <h1>Notre carte</h1>
  <p>Rue Saint-Gilles 149 · 4000 Liège</p>
  <p><a href="index.html">← Accueil</a> · <a href="tel:+32422318880">04 223 18 80</a></p>
</header>

<nav class="chips" id="chips" aria-label="Catégories de la carte"></nav>

<main>
  <div id="sugg"></div>
  <div id="carte"></div>
  <p class="note">Une allergie ou une intolérance ? Signalez-la à notre équipe avant de commander.<br>
    <a class="dl" href="docs/menu_vaudree2.pdf" download>Télécharger la carte (PDF)</a></p>
  <noscript><p class="note">JavaScript est nécessaire pour afficher la carte. Téléchargez la version <a href="docs/menu_vaudree2.pdf">PDF</a>.</p></noscript>
</main>

<div class="bar">
  <a class="go" href="commande-table-vaudree2.html">Réserver &amp; précommander</a>
  <a class="alt" href="suggestions.html">Nos suggestions</a>
</div>

<script src="horaires.js"></script>
<script src="menu-data.js"></script>
<script src="suggestions-data.js"></script>
<script>
const { esc, euro } = V;
const slug = (s, i) => "c" + i + "-" + s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const row = (n, p, d) => `<div class="item"><div><div class="name">${esc(n)}</div>${d ? `<div class="desc">${esc(d)}</div>` : ""}</div><div class="price">${euro(p)}</div></div>`;

const today = V.bxl().date, sg = V.suggestionsFor(today);
const chips = [];
if (sg.length) {
  chips.push(`<a href="#suggestions">✨ Suggestions</a>`);
  document.getElementById("sugg").innerHTML = `<section class="sugg" id="suggestions"><h2>Nos suggestions gourmandes</h2><p class="intro">Disponibles actuellement : entrée, plat ou dessert, au choix.</p>${V.groupSuggestions(sg).map(g => `<h3 class="sub">${esc(g.label)}</h3>` + g.items.map(s => row(s.nom, s.prix, s.desc)).join("")).join("")}</section>`;
}
document.getElementById("carte").innerHTML = MENU.map((c, i) => {
  c = Object.assign({}, c, { items: c.items.filter(it => it[1] > 0) });
  if (!c.items.length) return "";
  const id = slug(c.title, i); chips.push(`<a href="#${id}">${esc(c.title)}</a>`);
  return `<section id="${id}"><h2>${esc(c.title)}</h2>${c.description ? `<p class="intro">${esc(c.description)}</p>` : ""}${c.items.map(it => row(it[0], it[1], it[2])).join("")}</section>`;
}).join("");
document.getElementById("chips").innerHTML = chips.join("");
</script>
</body>
</html>
